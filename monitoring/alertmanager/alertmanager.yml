# Alerts show in Alertmanager (:9093) and Grafana. Nothing is sent anywhere until you
# add a receiver, for example:
#
#   - name: mail
#     email_configs:
#       - to: you@example.org
#         from: alerts@example.org
#         smarthost: smtp.example.org:587
#         auth_username: alerts@example.org
#         auth_password_file: /etc/alertmanager/smtp_password
#
# then set `receiver: mail` under `route`.
route:
  receiver: local
  group_by: [alertname, backend, service]
  group_wait: 15s
  group_interval: 2m
  repeat_interval: 4h

receivers:
  - name: local

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [service]
