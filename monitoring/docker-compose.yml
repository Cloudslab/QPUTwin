# =============================================================================
# QPUTwin monitoring stack. Koustav Kumar Mondal <erkoustavkumar@gmail.com>
#
#   ./up.sh     # creates secrets, installs Node Exporter, starts this stack
#   ./down.sh   # stops it; add --volumes to delete stored metrics as well
#
# It runs beside the QPUTwin stack and joins that stack's `qputwin-net` network, so
# start QPUTwin first. Node Exporter is the one component on the host: see
# node-exporter/install.sh.
#
# Every port is published on 127.0.0.1 only. cAdvisor and Portainer can reach the
# Docker socket, so set MONITORING_BIND with care.
# =============================================================================
name: qputwin-monitoring

x-defaults: &defaults
  restart: unless-stopped
  init: true
  labels:
    org.qputwin.contact: "Koustav Kumar Mondal <erkoustavkumar@gmail.com>"
    org.qputwin.role: "monitoring"

services:
  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [monitoring, qputwin-net]
    deploy:
      resources:
        limits: { cpus: "1", memory: 1g }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  alertmanager:
    <<: *defaults
    image: prom/alertmanager:v0.34.2
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:9093:9093"
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 128m }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  grafana:
    <<: *defaults
    image: grafana/grafana:13.3.0
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?run ./up.sh to create monitoring/.env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/01-qputwin-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]
    depends_on:
      prometheus: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1", memory: 512m }
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  cadvisor:
    <<: *defaults
    image: ghcr.io/google/cadvisor:v0.60.6
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=5s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service,org.qputwin.role
      - --disable_metrics=percpu,sched,tcp,udp,process,hugetlb,referenced_memory,cpu_topology,resctrl
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

  blackbox:
    <<: *defaults
    image: prom/blackbox-exporter:v0.29.1
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./blackbox:/etc/blackbox:ro
    networks: [monitoring, qputwin-net]
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 64m }

  # Tails data/telemetry.jsonl and publishes per-job metrics. No build step.
  qputwin-exporter:
    <<: *defaults
    image: python:3.13.16-slim-trixie
    command: ["python", "-u", "/app/exporter.py"]
    user: "${QPUTWIN_UID:-1000}:${QPUTWIN_GID:-1000}"
    environment:
      QPUTWIN_TEL_PATH: /data/telemetry.jsonl
      QPUTWIN_TEL_START: "${QPUTWIN_TEL_START:-end}"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./qputwin-exporter:/app:ro
      - ../data:/data:ro
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128m }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:9108/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  portainer:
    <<: *defaults
    image: portainer/portainer-ce:2.45.3
    command:
      - --admin-password-file=/run/secrets/portainer_admin_password
    ports:
      - "${MONITORING_BIND:-127.0.0.1}:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    secrets:
      - portainer_admin_password
    networks: [monitoring]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

secrets:
  portainer_admin_password:
    file: ./secrets/portainer_admin_password

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  portainer-data:

networks:
  monitoring:
    driver: bridge
  qputwin-net:
    external: true
    name: "${QPUTWIN_NETWORK:-qputwin_qputwin-net}"
