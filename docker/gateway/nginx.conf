# QPUTwin HA gateway (compose profile "ha") — round-robins the public API over every
# orchestrator replica. Koustav Kumar Mondal <koustav@koustavmondal.com>
#
# Docker's embedded DNS (127.0.0.11) returns every replica of the `orchestrator`
# service; using a variable in proxy_pass makes nginx re-resolve it every 5 s, so
# `docker compose up --scale orchestrator=N` is picked up without a reload.
worker_processes auto;
events { worker_connections 4096; }
http {
  access_log off;
  resolver 127.0.0.11 valid=5s ipv6=off;
  client_max_body_size 2m;
  server {
    listen 8080;
    location = /gateway/health { return 200 "ok\n"; }
    location / {
      set $orchestrator http://orchestrator:8000;
      proxy_pass $orchestrator;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 900s;
      proxy_next_upstream error timeout;   # connection failures move on to another replica
    }
  }
}
